# Anything matching these must never be committed here. CI fails on a match.
patterns:
  - 'COM-\d+'
  - 'HAS-\d+'
  - 'LSARS-'
  - 'idengrenme'
  - 'lsadigital'
  - 'lsa\.dev'
  - 'dev/common'
  - 'mike@'
  - 'keith@'
  - 'sk-ant-[A-Za-z0-9_-]{20,}'
  - 'ghp_[A-Za-z0-9]{30,}'
  - 'xox[bap]-[A-Za-z0-9-]{20,}'
  - 'AKIA[0-9A-Z]{16}'
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  - '\bgh[oprsu]_[A-Za-z0-9]{36,}\b'
  - '\bgithub_pat_[A-Za-z0-9_]{20,}\b'
  - '\bglpat-[A-Za-z0-9_\-]{20,}\b'
  - '\bxox[baprs]-[A-Za-z0-9\-]{20,}\b'
  - '\bnpm_[A-Za-z0-9]{20,}\b'
  - '\bpypi-[A-Za-z0-9_\-]{20,}\b'
  - '\bBearer\s+[A-Za-z0-9._~+/=-]{20,}\b'
  - '\b(?:api[_-]?key|secret|token|access[_-]?token|client[_-]?secret)\b\s*[:=]\s*[''"]?[A-Za-z0-9._~+/=:\-]{20,}[''"]?'
  - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  - '/Users/|/home/|/root/'
  - 'sk-[A-Za-z0-9_-]{12,}'
  - 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
  - '-----BEGIN[ A-Z]*PRIVATE KEY-----'
