  - plan_status
  - phase
  - ac_complete
  - template_id
  - template_version
  - components
  - features
  - title
  - last_updated
  - jira_ticket
  - parent
  - technical_design_spec
  - recommended_agent_team
  - ceremony_tier
  - effective_pattern
  - catalog_pattern_selection
  - testing_strategy
  - uat_state_policy
  - test_data_strategy
  - automated_uat
  - e2e_policy
  - nfr_catalog
  - automated_nfr
  - per_phase_nfr_gate
  - status_line
  - overview
  - scope
  - acceptance_criteria
core_field_classification:
  invariant:
    - status
    - plan_status
    - phase
    - ac_complete
    - components
    - features
    - title
    - last_updated
    - jira_ticket
    - status_line
    - overview
    - scope
    - acceptance_criteria
  parameter:
    template_id:
      LITE: PLAN_TEMPLATE_QUICK
      QUICK: PLAN_TEMPLATE_QUICK
      FULL: PLAN_TEMPLATE
      FEATURE: PLAN_FEATURE_TEMPLATE
    template_version:
      LITE: 1
      QUICK: 1
      FULL: 1
      FEATURE: 1
    parent:
      LITE: N/A
      QUICK: optional
      FULL: optional
      FEATURE: required
    technical_design_spec:
      LITE: omitted
      QUICK: optional
      FULL: required
      FEATURE: required
    recommended_agent_team:
      LITE: omitted
      QUICK: required
      FULL: required
      FEATURE: required
    ceremony_tier:
      LITE: N/A
      QUICK: selected
      FULL: selected
      FEATURE: N/A
    effective_pattern:
      LITE: N/A
      QUICK: selected
      FULL: selected
      FEATURE: issue-type-Feature
    testing_strategy:
      LITE: omitted
      QUICK: required
      FULL: required
      FEATURE: required
    uat_state_policy:
      LITE: omitted
      QUICK: conditional
      FULL: conditional
      FEATURE: conditional
    test_data_strategy:
      LITE: omitted
      QUICK: conditional
      FULL: conditional
      FEATURE: conditional
  bundle-owned:
    - catalog_pattern_selection
    - automated_uat
    - e2e_policy
    - nfr_catalog
    - automated_nfr
    - per_phase_nfr_gate
addons:
  uat-round-tracking:
    registered: true
    allowed_bundles: [QUICK, FULL, FEATURE]
    reason: Slice C (T5.2) registered this @1 as a --with-only addon; see patterns.uat-round-tracking above.
  rapid-vibe-ui:
    registered: true
    allowed_bundles: [QUICK]
    reason: Owner-approved opt-in for rapid existing-UI refinement; use QUICK plus living browser contracts and close reconciliation.
  preissued-rulings:
    registered: true
    allowed_bundles: [QUICK, FULL, FEATURE]
    reason: Conditional QUICK/FULL/FEATURE weak-orchestrator armor; select only when evidenced T1-T5 failure classes match and emit only matching rulings plus the escalation capstone.
