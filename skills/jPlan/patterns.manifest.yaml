header_contribution_contract:
  required_ownership: every-exact-"**Key:**"-plan-header-line
  validation: compare each contributing pattern's Header lines section with singleton_header_ownership
  duplicate_owner: fail-loud
collision_rules:
  duplicate_singleton_header: fail-loud
  duplicate_contributed_section: fail-loud
  canonical_matrix_header: byte-exact-required
  unresolved_placeholder: fail-loud
  unmapped_ceremony_preset: fail-loud
version_bump_rules:
  template_version: integer
  baseline_fixture_version: 2
  composition_change_reaching_template: bump_that_template
  core_change: bump_all_templates
  pattern_change: bump_only_templates_whose_bundle_contains_pattern
  no_op_regeneration:
    versions: unchanged
    bytes: unchanged
provenance:
  assembled_plan:
    created_from_template: CORE@<integer>
    assembled_patterns: ["<id>@<integer>"]
  generated_template:
    preserve_template_id: true
    preserve_template_version: true
content_ownership:
  core-frontmatter-title-overview-scope-acceptance: template.CORE.md
  lite-briefing-shape: pattern.briefing.md
  planning-phases-tasks-testing-completion-retro: pattern.planning-scaffold.md
  ac-to-test-traceability: pattern.planning-scaffold.md
  uat-matrix-automated-uat-plan-and-results: pattern.uat-chain.md
  nfr-matrix-validation-and-sidecar-rules: pattern.nfr-chain.md
  ac-14-nfr-weighting: pattern.nfr-chain.md
  security-compliance-baseline: pattern.security-baseline.md
  outcome-metrics: pattern.outcome-metrics.md
  user-experience: pattern.ux-section.md
  catalog-pattern-selection: pattern.catalog-pattern-selection.md
  feature-pe2e-contracts-governance-and-defect-trackers: pattern.feature-governance.md
  story-feature-pe2e-contributions: pattern.pe2e-contributions.md
  dashboard-delivery-render-tier: pattern.dashboard-render-tier.md
  feature-child-dashboard-projections: pattern.dashboard-projections.md
  required-reading-and-agent-assignment: pattern.plan-governance.md
  full-risk_rollback-and-screenshot-evidence: pattern.plan-governance.md
  smoke-test-impact-assessment: pattern.plan-governance.md
  error-handling-and-observability-requirements: pattern.plan-governance.md
  test-catalog-review-and-e2e-tests-enabled: pattern.plan-governance.md
  critical-files: pattern.plan-governance.md
  critical-reminders: pattern.planning-scaffold.md
  definition-of-doneness-uat-nfr-status-ladder: pattern.uat-chain.md
  bug-master-ledger-and-uat-round-tracking: pattern.uat-round-tracking.md
  rapid-vibe-ui-living-contracts-and-close-reconciliation: pattern.rapid-vibe-ui.md
  conditional-preissued-execution-rulings-and-escalation-budget: pattern.preissued-rulings.md
  feature-context-and-delegation-recommendations: pattern.feature-governance.md
  feature-summary: pattern.feature-governance.md
  uat-scenario-alignment-feature: pattern.feature-governance.md
  implementation-order-and-story-dependencies: pattern.feature-governance.md
  scope-boundary-and-feature-risk-rollback: pattern.feature-governance.md
  open-questions-and-known-technical-debt: pattern.feature-governance.md
