manifest_version: 1
assembly_engine:
  command: jswarm/new_work_templates/assemble.py
  sole_executable_path: true
  dependencies:
    - PyYAML
    - jswarm/patterns/recommend.py:PRESET_KEYS
    - jswarm/precompact_reconcile/lifecycle_audit.py
  output_receipts:
    plan_birth: .jswarm/plans/<TICKET>/<TICKET>.assembly-receipts.ndjson
    regeneration: jswarm/new_work_templates/regen-receipts.ndjson
  generated_file_marker: YAML-frontmatter comment containing GENERATED
patterns:
  briefing: {version: 1, file: pattern.briefing.md}
  planning-scaffold: {version: 1, file: pattern.planning-scaffold.md}
  uat-chain: {version: 1, file: pattern.uat-chain.md}
  nfr-chain: {version: 1, file: pattern.nfr-chain.md}
  security-baseline: {version: 1, file: pattern.security-baseline.md}
  outcome-metrics: {version: 1, file: pattern.outcome-metrics.md}
  ux-section: {version: 1, file: pattern.ux-section.md}
  catalog-pattern-selection: {version: 1, file: pattern.catalog-pattern-selection.md}
  feature-governance: {version: 1, file: pattern.feature-governance.md}
  pe2e-contributions: {version: 1, file: pattern.pe2e-contributions.md}
  dashboard-render-tier: {version: 1, file: pattern.dashboard-render-tier.md}
  dashboard-projections: {version: 1, file: pattern.dashboard-projections.md}
  plan-governance: {version: 1, file: pattern.plan-governance.md}
  uat-round-tracking: {version: 1, file: pattern.uat-round-tracking.md}
  rapid-vibe-ui: {version: 1, file: pattern.rapid-vibe-ui.md}
  preissued-rulings: {version: 1, file: pattern.preissued-rulings.md}
injection_order:
  - briefing
  - catalog-pattern-selection
  - pe2e-contributions
  - ux-section
  - uat-chain
  - uat-round-tracking
  - rapid-vibe-ui
  - preissued-rulings
  - nfr-chain
  - security-baseline
  - outcome-metrics
  - dashboard-render-tier
  - dashboard-projections
  - feature-governance
  - plan-governance
  - planning-scaffold
bundles:
  LITE:
    - briefing
  QUICK:
    - catalog-pattern-selection
    - nfr-chain
    - security-baseline
    - outcome-metrics
    - planning-scaffold
  FULL:
    - catalog-pattern-selection
    - pe2e-contributions
    - ux-section
    - uat-chain
    - nfr-chain
    - security-baseline
    - outcome-metrics
    - dashboard-render-tier
    - dashboard-projections
    - plan-governance
    - planning-scaffold
  FEATURE:
    - catalog-pattern-selection
    - uat-chain
    - nfr-chain
    - security-baseline
    - outcome-metrics
    - feature-governance
    - dashboard-render-tier
    - planning-scaffold
ceremony_preset_to_bundle:
  l1.story.low-essential: QUICK
  l1.story.medium-standard: FULL
  l1.story.high-assurance: FULL
  --lite mode: LITE
  issue type Feature: FEATURE
  legacy/no-selection:Quick: QUICK
  legacy/no-selection:Standard: FULL
  legacy/no-selection:Deep: FULL
