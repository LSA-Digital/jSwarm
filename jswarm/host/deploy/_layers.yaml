# Controlled-config layer registry.
# This file is mastered here (co-located with jswarm/host/deploy/layers.py, its
# only reader) and is the single source of truth for which physical contexts
# exist and where each one deploys. Edit it here; it is read by deploy.py /
# verify_dotclaude_topology.py / adopt.py / migrate_one_home.py via
# jswarm/host/deploy/layers.py. The ``dotclaude_root`` each layer's ``dir`` is
# resolved against is always supplied by the caller (e.g. --master-root); this
# file carries no assumption about where that root lives on disk.
#
# ONE-HOME / ONE-TARGET MODEL: each context = exactly one deploy target. This is a
# registry of physical contexts only — NOT a precedence registry. Runtime
# precedence (enterprise > user > repo) is Claude Code's own cascade, never the
# deploy engine. Do NOT add rank / precedence / may_target / target_contexts /
# targets / mask fields — the loader rejects them on purpose.
schema: com176.layers.v1-one-home
root: dotclaude
layers:
  enterprise:
    enabled: false
    dir: enterprise
    deploy_target:
      kind: path
      path: /opt/example-org/claude/.claude
    description: Enterprise-managed Claude Code context. Disabled until an enterprise location is provisioned.

  user:
    enabled: true
    dir: user
    deploy_target:
      kind: root_arg
      arg: home_root
    description: Operator user-level Claude Code context, normally ~/.claude.

  repo.common:
    enabled: true
    dir: repo.common
    deploy_target:
      kind: root_arg
      arg: common_root
    description: This repo checkout's project-local .claude context.
