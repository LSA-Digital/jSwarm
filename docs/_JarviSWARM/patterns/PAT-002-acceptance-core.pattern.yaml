schema_version: '0.2'
id: PAT-002
level: l2_ingredient
key: l2.acceptance-core
name: Acceptance Core and Scope Boundaries
family: delivery-ceremony
kind: execution-practice
intent: Anchor execution on explicit acceptance criteria, scope boundaries, and evidence mapping before selecting deeper ceremony.
problem:
  context: Acceptance Core and Scope Boundaries is needed when ticket execution must translate ceremony selection into enforceable delivery behavior.
  forces:
  - Delivery speed matters, but guidance must compile into concrete obligations.
  - Agents need visible stop conditions and evidence surfaces, not prose-only advice.
  - Reviewers need stable markers that can be checked consistently across tickets.
applicability:
  use_when: &id001
  - A story needs explicit acceptance criteria, scope boundaries, and evidence mapping before implementation.
  - The work could be mistaken for broad improvement without a concrete done definition.
  avoid_when: &id002
  - The request is a mechanical one-line correction with already obvious acceptance evidence.
ceremony:
  tier: tiered
  default_depth: standard
  supported_tiers:
  - low
  - medium
  - high
selection_forces:
  use_when: *id001
  avoid_when: *id002
  signals:
  - scope_blast_radius
  - user_visible_behavior
  - shared_contract_surface
compile:
  plan_fields: &id003
  - acceptance_criteria
  - scope_boundaries
  - ac_to_evidence_map
  required_prompt_clauses: &id004
  - Restate acceptance criteria and scope boundaries before coding.
  - Map every acceptance criterion to evidence or explicit N/A.
solution_summary: Anchor execution on explicit acceptance criteria, scope boundaries, and evidence mapping before selecting deeper ceremony.
lifecycle_hooks:
  jplan:
    selection_guidance: Select PAT-002 (l2.acceptance-core) when its use_when forces are present; record the chosen depth and any rejected lighter alternative.
    plan_fields: *id003
  implement:
    practices: &id005
    - Restate acceptance criteria and out-of-scope items in the plan.
    - Map each acceptance criterion to evidence before broad coding.
    - Stop if acceptance criteria are ambiguous enough to change the solution.
  close_ticket:
    retro_prompts:
    - Did l2.acceptance-core add the right amount of ceremony for the ticket shape?
    - Which evidence or stop condition from l2.acceptance-core was most useful?
  feature_reconcile:
    outcome_use: Aggregate outcomes for l2.acceptance-core to tune default depths and preset composition.
  devops_maint:
    drift_or_telemetry: Surface selections of l2.acceptance-core that lack compiled obligations or review evidence.
constraint_surfaces:
  plan_fields: *id003
  required_agents:
  - test-engineer when proof design or test coverage is part of the selected ingredient
  forbidden_routes:
  - Claiming catalog Pattern compliance without material plan, prompt, test, or review evidence.
  required_prompt_clauses: *id004
execution_practices: *id005
evidence_tests:
- Plan includes acceptance criteria, out-of-scope boundaries, and an A/C-to-evidence map.
- Reviewer can trace each completion claim to an acceptance proof.
ac_to_uat_mapping:
  required: true
  map_shape: Each affected acceptance criterion maps to an automated test, UAT scenario, smoke command, review artifact, or explicit N/A rationale.
thin_slice_uat_proof:
  first_proof_point: Run or record the smallest proof that exercises the selected obligation before broad implementation expands.
  stop_conditions:
  - The selected obligation has no concrete evidence path.
  - The proof cannot run and no explicit N/A or blocker is recorded.
  - The implementation proceeds broadly before the selected proof is satisfied.
minimum_viable_architecture:
  rule: Use only the architecture needed to satisfy acceptance criteria, selected ingredients, and dominant NFR weights.
sufficient_design:
  rule: Design enough to materialize plan fields, prompt clauses, tests, and reviewer gates; defer speculative generalization.
nfr_weighting:
  transparency: high
  maintainability: high
  reliability: medium
  rationale: Acceptance core prioritizes clear scope and traceable completion evidence.
reviewer_enforcement:
- Reject implementation completion when acceptance criteria or evidence mapping are missing.
anti_patterns:
- Treating the Pattern as descriptive prose without plan fields or gate evidence.
- Selecting a heavier or lighter ceremony tier without recording risk rationale.
- Replacing acceptance evidence with implementation-shape assertions only.
tradeoffs:
- Adds explicit ceremony and review markers before or during implementation.
- Reduces late rework by making obligations visible to agents and reviewers.
