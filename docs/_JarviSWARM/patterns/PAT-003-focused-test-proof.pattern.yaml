schema_version: '0.2'
id: PAT-003
level: l2_ingredient
key: l2.focused-test-proof
name: Focused Test Proof
family: delivery-ceremony
kind: execution-practice
intent: Require a narrow test, smoke, or command proof that directly exercises the changed behavior.
problem:
  context: Focused Test Proof is needed when ticket execution must translate ceremony selection into enforceable delivery behavior.
  forces:
  - Delivery speed matters, but guidance must compile into concrete obligations.
  - Agents need visible stop conditions and evidence surfaces, not prose-only advice.
  - Reviewers need stable markers that can be checked consistently across tickets.
applicability:
  use_when: &id001
  - A small reversible change still needs one targeted automated or command proof.
  - Regression risk is local and can be covered by a focused test or smoke.
  avoid_when: &id002
  - The ticket requires full scenario coverage, browser UAT, or a managed regression suite.
ceremony:
  tier: tiered
  default_depth: basic
  supported_tiers:
  - low
  - medium
  - high
selection_forces:
  use_when: *id001
  avoid_when: *id002
  signals:
  - scope_blast_radius
  - reversibility_migration_risk
compile:
  required_prompt_clauses: &id004
  - Identify the smallest focused test or smoke that proves the change.
  reviewer_enforcement:
  - Reject completion if no focused proof or N/A rationale exists.
solution_summary: Require a narrow test, smoke, or command proof that directly exercises the changed behavior.
lifecycle_hooks:
  jplan:
    selection_guidance: Select PAT-003 (l2.focused-test-proof) when its use_when forces are present; record the chosen depth and any rejected lighter alternative.
    plan_fields: &id003
    - engineering_pattern_references
  implement:
    practices: &id005
    - Prefer upgrading an existing focused test before adding broad new coverage.
    - Run the focused proof before claiming completion.
  close_ticket:
    retro_prompts:
    - Did l2.focused-test-proof add the right amount of ceremony for the ticket shape?
    - Which evidence or stop condition from l2.focused-test-proof was most useful?
  feature_reconcile:
    outcome_use: Aggregate outcomes for l2.focused-test-proof to tune default depths and preset composition.
  devops_maint:
    drift_or_telemetry: Surface selections of l2.focused-test-proof that lack compiled obligations or review evidence.
constraint_surfaces:
  plan_fields: *id003
  required_agents:
  - test-engineer when proof design or test coverage is part of the selected ingredient
  forbidden_routes:
  - Claiming catalog Pattern compliance without material plan, prompt, test, or review evidence.
  required_prompt_clauses: *id004
execution_practices: *id005
evidence_tests:
- A focused proof command and final result are recorded.
- The proof covers changed behavior rather than only import or syntax shape.
ac_to_uat_mapping:
  required: true
  map_shape: Each affected acceptance criterion maps to an automated test, UAT scenario, smoke command, review artifact, or explicit N/A rationale.
thin_slice_uat_proof:
  first_proof_point: Run or record the smallest proof that exercises the selected obligation before broad implementation expands.
  stop_conditions:
  - The selected obligation has no concrete evidence path.
  - The proof cannot run and no explicit N/A or blocker is recorded.
  - The implementation proceeds broadly before the selected proof is satisfied.
minimum_viable_architecture:
  rule: Use only the architecture needed to satisfy acceptance criteria, selected ingredients, and dominant NFR weights.
sufficient_design:
  rule: Design enough to materialize plan fields, prompt clauses, tests, and reviewer gates; defer speculative generalization.
nfr_weighting:
  reliability: high
  efficiency_readability: high
  maintainability: medium
  rationale: Focused proof gives fast confidence without expanding ceremony unnecessarily.
reviewer_enforcement:
- Reject proof claims that do not exercise the changed behavior.
anti_patterns:
- Treating the Pattern as descriptive prose without plan fields or gate evidence.
- Selecting a heavier or lighter ceremony tier without recording risk rationale.
- Replacing acceptance evidence with implementation-shape assertions only.
tradeoffs:
- Adds explicit ceremony and review markers before or during implementation.
- Reduces late rework by making obligations visible to agents and reviewers.
