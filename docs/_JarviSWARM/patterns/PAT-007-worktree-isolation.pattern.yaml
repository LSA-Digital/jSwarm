  components: []
external_precedents:
- name: Git worktree documentation
  url: https://git-scm.com/docs/git-worktree
  source_type: version-control-documentation
  citation_note: Documents linked working trees as separate checkouts attached to one repository for parallel work on different branches.
  usage_boundary: Used as precedent for isolated checkout mechanics; JarviSWARM adds ticket-specific serialization and evidence rules.
- name: Trunk-Based Development short-lived branches
  url: https://trunkbaseddevelopment.com/short-lived-feature-branches/
  source_type: engineering-practice
  citation_note: Describes small concurrent branch work and integration discipline for reducing collision and drift risk.
  usage_boundary: Used as precedent for concurrency control expectations, not as a mandate for one branching strategy.
