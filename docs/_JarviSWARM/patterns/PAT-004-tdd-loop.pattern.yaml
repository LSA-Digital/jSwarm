schema_version: '0.2'
id: PAT-004
level: l2_ingredient
key: l2.tdd-loop
name: TDD Red-Green-Refactor Loop
family: delivery-ceremony
kind: execution-practice
intent: Drive implementation through a visible red-green-refactor loop so behavior changes are specified before code is shaped.
problem:
  context: TDD Red-Green-Refactor Loop is needed when ticket execution must translate ceremony selection into enforceable delivery behavior.
  forces:
  - Delivery speed matters, but guidance must compile into concrete obligations.
  - Agents need visible stop conditions and evidence surfaces, not prose-only advice.
  - Reviewers need stable markers that can be checked consistently across tickets.
applicability:
  use_when: &id001
  - Behavior is clear enough to write a failing test before implementation.
  - A regression should remain executable after the ticket closes.
  avoid_when: &id002
  - The work is exploratory discovery where tests would encode guesses rather than requirements.
ceremony:
  tier: medium
  default_depth: standard
  supported_tiers:
  - low
  - medium
  - high
selection_forces:
  use_when: *id001
  avoid_when: *id002
  signals:
  - user_visible_behavior
  - shared_contract_surface
  - reversibility_migration_risk
compile:
  required_prompt_clauses: &id004
  - Start with or identify the failing test that describes intended behavior.
  - Keep implementation minimal until the test passes.
  plan_fields: &id003
  - test_first_plan
  - red_green_evidence
solution_summary: Drive implementation through a visible red-green-refactor loop so behavior changes are specified before code is shaped.
lifecycle_hooks:
  jplan:
    selection_guidance: Select PAT-004 (l2.tdd-loop) when its use_when forces are present; record the chosen depth and any rejected lighter alternative.
    plan_fields: *id003
  implement:
    practices: &id005
    - Author or identify the failing behavior test first.
    - Implement the smallest change that turns the proof green.
    - Refactor only after preserving the green proof.
  close_ticket:
    retro_prompts:
    - Did l2.tdd-loop add the right amount of ceremony for the ticket shape?
    - Which evidence or stop condition from l2.tdd-loop was most useful?
  feature_reconcile:
    outcome_use: Aggregate outcomes for l2.tdd-loop to tune default depths and preset composition.
  devops_maint:
    drift_or_telemetry: Surface selections of l2.tdd-loop that lack compiled obligations or review evidence.
constraint_surfaces:
  plan_fields: *id003
  required_agents:
  - test-engineer when proof design or test coverage is part of the selected ingredient
  forbidden_routes:
  - Claiming catalog Pattern compliance without material plan, prompt, test, or review evidence.
  required_prompt_clauses: *id004
execution_practices: *id005
evidence_tests:
- Evidence includes the failing or pre-existing failing condition and the passing result after implementation.
- Regression proof remains in the test suite or documented smoke path.
ac_to_uat_mapping:
  required: true
  map_shape: Each affected acceptance criterion maps to an automated test, UAT scenario, smoke command, review artifact, or explicit N/A rationale.
thin_slice_uat_proof:
  first_proof_point: Run or record the smallest proof that exercises the selected obligation before broad implementation expands.
  stop_conditions:
  - The selected obligation has no concrete evidence path.
  - The proof cannot run and no explicit N/A or blocker is recorded.
  - The implementation proceeds broadly before the selected proof is satisfied.
minimum_viable_architecture:
  rule: Use only the architecture needed to satisfy acceptance criteria, selected ingredients, and dominant NFR weights.
sufficient_design:
  rule: Design enough to materialize plan fields, prompt clauses, tests, and reviewer gates; defer speculative generalization.
nfr_weighting:
  reliability: high
  maintainability: high
  efficiency_readability: medium
  rationale: TDD makes behavior expectations durable and keeps changes small.
reviewer_enforcement:
- Reject broad implementation without a behavior proof when this ingredient is selected.
inline_gate_dedup:
  supersession_rule: When an inline jCritic or jVerifier lane reviews the red-green proof during implementation and attaches its verdict, the default orchestrator-level review gate is not re-run for that same proof; the inline verdict supersedes it.
  inline_reviewer_roles:
  - jCritic
  - jVerifier
  evidence_requirements:
  - Inline reviewer verdict recorded in the ticket evidence folder with the reviewer identity.
  - Red-to-green proof (failing-then-passing test output) attached alongside the verdict.
  author_not_approve_separation: true
  second_lane_exceptions:
  - Security-sensitive or compliance-touching changes still require a second independent jSecurityReviewer lane.
  - Shared-contract or cross-cutting architecture changes still require an independent jArchitect review lane.
anti_patterns:
- Treating the Pattern as descriptive prose without plan fields or gate evidence.
- Selecting a heavier or lighter ceremony tier without recording risk rationale.
- Replacing acceptance evidence with implementation-shape assertions only.
tradeoffs:
- Adds explicit ceremony and review markers before or during implementation.
- Reduces late rework by making obligations visible to agents and reviewers.
