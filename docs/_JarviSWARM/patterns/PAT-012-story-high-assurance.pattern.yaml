schema_version: '0.2'
id: PAT-012
level: l1_preset
key: l1.story.high-assurance
name: Story High Assurance Preset
family: delivery-ceremony
kind: story-preset
intent: Compose the base high story preset into concrete Q5-Q9, review, NFR, UAT, worktree, and context obligations.
problem:
  context: Story High Assurance Preset is needed when ticket execution must translate ceremony selection into enforceable delivery behavior.
  forces:
  - Delivery speed matters, but guidance must compile into concrete obligations.
  - Agents need visible stop conditions and evidence surfaces, not prose-only advice.
  - Reviewers need stable markers that can be checked consistently across tickets.
applicability:
  use_when: &id001
  - A story has security, shared-contract, migration, live UX, broad registry, or architecture-runway risk that needs full assurance.
  avoid_when: &id002
  - The work is exploratory only, non-production, or explicitly downgraded with risk rationale and reviewer agreement.
ceremony:
  tier: high
  default_depth: deep
  supported_tiers:
  - low
  - medium
  - high
selection_forces:
  use_when: *id001
  avoid_when: *id002
  signals:
  - scope_blast_radius
  - user_visible_behavior
  - shared_contract_surface
  - security_compliance_external_write
  - reversibility_migration_risk
  - novelty_architecture_uncertainty
  - concurrency_shared_files
compile:
  q5_depth: deep
  q6_execution_team_hint: pattern_1
  review_tier_input: evaluate_xhigh_triggers
  architecture_tier_input: chk_am_required
  automated_uat: required_for_ui
  e2e_policy: per_ticket_if_stable
  test_data_strategy: managed_required
  worktree: required_or_serialized
  nfr: full_utility_tree
  precompact_cadence: heavy
  orchestrator_context: 1m_required
  plan_fields: &id003
  - engineering_pattern_references
  - options_tradeoffs
  - full_utility_tree
  - ac_to_nfr_matrix
  - bdd_uat_scenarios
  - worktree_or_serialization_stop_conditions
  - heavy_checkpoint_plan
  required_prompt_clauses: &id004
  - Use High Assurance for hard-High triggers or broad shared risk.
  - Build full utility-tree, UAT, worktree/serialization, review-rubric, and checkpoint obligations before coding.
  - Do not invoke architect-master or xhigh review silently; record trigger evidence and required approval.
  - For non-UI or non-stable journeys, defer E2E only with recorded rationale and substitute API, CLI, migration, or contract proof.
  reviewer_enforcement: &id006
  - Reject missing full utility tree or high-risk stop conditions.
  - Reject high assurance completion without adversarial review-rubric evidence.
  - Reject unmanaged test data for regression or migration-sensitive work.
solution_summary: Compose the base high story preset into concrete Q5-Q9, review, NFR, UAT, worktree, and context obligations.
lifecycle_hooks:
  jplan:
    selection_guidance: Select PAT-012 (l1.story.high-assurance) when its use_when forces are present; record the chosen depth and any rejected lighter alternative.
    plan_fields: *id003
  implement:
    practices: &id005
    - Resolve included L2 ingredients before planning execution.
    - Apply the compiled Q5-Q9 levers and record any user override rationale.
    - Run reviewer enforcement against the compiled obligations before closeout.
  close_ticket:
    retro_prompts:
    - Did l1.story.high-assurance add the right amount of ceremony for the ticket shape?
    - Which evidence or stop condition from l1.story.high-assurance was most useful?
  feature_reconcile:
    outcome_use: Aggregate outcomes for l1.story.high-assurance to tune default depths and preset composition.
  devops_maint:
    drift_or_telemetry: Surface selections of l1.story.high-assurance that lack compiled obligations or review evidence.
constraint_surfaces:
  plan_fields: *id003
  required_agents:
  - executor or hephaestus for implementation work matching the selected preset
  - critic or verifier for independent review of compiled obligations
  forbidden_routes:
  - Changing Q6 execution-team tiers solely because the preset is high ceremony.
  - Skipping include-resolution or conflict checks before using compiled obligations.
  required_prompt_clauses: *id004
execution_practices: *id005
evidence_tests:
- All included L2 keys resolve to existing active catalog records.
- Compile block contains every required lever and non-empty enforcement lists.
- Reviewer can verify each compiled obligation in the plan or final evidence.
ac_to_uat_mapping:
  required: true
  map_shape: Each affected acceptance criterion maps to an automated test, UAT scenario, smoke command, review artifact, or explicit N/A rationale.
thin_slice_uat_proof:
  first_proof_point: Run or record the smallest proof that exercises the selected obligation before broad implementation expands.
  stop_conditions:
  - The selected obligation has no concrete evidence path.
  - The proof cannot run and no explicit N/A or blocker is recorded.
  - The implementation proceeds broadly before the selected proof is satisfied.
minimum_viable_architecture:
  rule: Use only the architecture needed to satisfy acceptance criteria, selected ingredients, and dominant NFR weights.
sufficient_design:
  rule: Design enough to materialize plan fields, prompt clauses, tests, and reviewer gates; defer speculative generalization.
nfr_weighting:
  reliability: high
  transparency: high
  maintainability: high
  rationale: The high preset makes ceremony selection deterministic and reviewable.
reviewer_enforcement: *id006
anti_patterns:
- Treating the Pattern as descriptive prose without plan fields or gate evidence.
- Selecting a heavier or lighter ceremony tier without recording risk rationale.
- Replacing acceptance evidence with implementation-shape assertions only.
tradeoffs:
- Adds explicit ceremony and review markers before or during implementation.
- Reduces late rework by making obligations visible to agents and reviewers.
