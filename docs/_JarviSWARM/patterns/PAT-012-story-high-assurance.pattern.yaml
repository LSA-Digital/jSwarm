composition:
  includes:
  - key: l2.acceptance-core
    depth: deep
    required: true
    params: {}
  - key: l2.thin-slice-proof
    depth: deep
    required: true
    params: {}
  - key: l2.focused-test-proof
    depth: standard
    required: true
    params: {}
  - key: l2.tdd-loop
    depth: deep
    required: true
    params: {}
  - key: l2.bdd-uat-scenarios
    depth: deep
    required: true
    params: {}
  - key: l2.nfr-utility-tree
    depth: deep
    required: true
    params:
      mode: full_utility_tree
  - key: l2.worktree-isolation
    depth: deep
    required: true
