  source_type: reliability-runbook-practice
  citation_note: Emphasizes durable incident state, handoffs, and clear operational records during long-running work.
  usage_boundary: Used as precedent for checkpoint and handoff discipline; JarviSWARM applies the idea to agent context windows.
- name: OpenAI Swarm routines and handoffs
  url: https://github.com/openai/swarm#routines-and-handoffs
  source_type: agent-orchestration-reference
  citation_note: Describes explicit routines and handoffs as a way to transfer control and preserve task state between agents.
  usage_boundary: Used as precedent for context handoff concepts, not as a dependency or endorsement of that framework.
